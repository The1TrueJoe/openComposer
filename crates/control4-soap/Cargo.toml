# control4-soap — the c4soap wire protocol + client, shared by three consumers:
# control4-navigator-sink-lib, control4-fake-navigator, and openComposer.
#
# This crate currently holds the PROTOCOL layer only (soap.rs + xml.rs). The
# model/client layers are blocked by app-domain coupling in openComposer — see
# DESIGN.md §2/§4. `publish = false` is a guard: the owner removes it to publish
# (see PUBLISH.md); nothing is published tonight.
[package]
name = "control4-soap"
version = "0.1.0"
edition = "2024"
description = "c4soap: the Control4 Director wire protocol — cert-pinned XML-over-TLS, with a typed, byte-exact request builder."
repository = "https://github.com/The1TrueJoe/control4-soap"
keywords = ["control4", "c4soap", "director", "home-automation", "tls"]
categories = ["network-programming", "api-bindings"]
# license = "..."  # set before publishing (see PUBLISH.md)
publish = false  # guard: refuses an accidental `cargo publish` until the owner removes it

[dependencies]
hex = "0.4.3"
roxmltree = "0.21.1"
# The TLS fallback key provider (keys.rs) signs with RustCrypto's `rsa` for the
# sub-2048-bit RSA client keys `ring` rejects, hashing with sha2 0.10's traits.
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha2_10 = { version = "0.10", package = "sha2", features = ["oid"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["net", "io-util", "sync", "time", "rt"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
