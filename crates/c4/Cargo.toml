[package]
name = "c4"
version.workspace = true
edition.workspace = true

[dependencies]
hex = "0.4.3"
md-5 = "0.10"
# Controller takeover: MAC-derived stock root password (older OS) uses PBKDF2-HMAC-SHA384
# over the sha2 0.10 digest traits (sha2_10 below), and the cert-chain swap parses X.509
# subjects to dedupe by identity. x509-parser is pure-Rust (no OpenSSL), so it links on
# every target the rest of c4 already does.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
x509-parser = "0.16"
# The in-process CA (takeover::ca) generates RSA keys — controllers' legacy TLS wants RSA,
# and rcgen's ring backend can sign with an RSA key but not generate one, so the `rsa`
# crate makes the key (PKCS#8 PEM) and rcgen builds and signs the certs from it.
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
roxmltree = "0.21.1"
rsa = { version = "0.9", features = ["pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha2_10 = { version = "0.10", package = "sha2", features = ["oid"] }
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
