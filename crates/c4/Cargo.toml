[package]
name = "c4"
version.workspace = true
edition.workspace = true

[dependencies]
hex = "0.4.3"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
roxmltree = "0.21.1"
rsa = "0.9"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha2_10 = { version = "0.10", package = "sha2", features = ["oid"] }
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
